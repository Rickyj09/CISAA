{% extends "base.html" %}
{% block content %}

<div class="container mt-5">
  <h2>Blog - Administración</h2>
  <a href="/admin/posts/new" class="btn btn-success mb-3">Nuevo Post</a>

  <table class="table">
    <tr>
      <th>Título</th>
      <th>Fecha</th>
      <th>Estado</th>
    </tr>
    {% for post in posts %}
    <tr>
      <td>{{ post.title }}</td>
      <td>{{ post.created_at.strftime("%d/%m/%Y") }}</td>
      <td>{{ "Publicado" if post.published else "Borrador" }}</td>
    </tr>
    {% endfor %}
  </table>
</div>

{% endblock %}

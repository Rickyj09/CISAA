{% extends "base_admin.html" %}
{% block content %}

<div class="container mt-5">
  <h2 class="fw-bold mb-4">
    {% if post %}Editar Post{% else %}Nuevo Post{% endif %}
  </h2>

<form method="POST" id="postForm" novalidate>

  <div class="mb-3">
    <label class="form-label">Título</label>
    <input type="text" name="title" class="form-control" value="{{ post.title }}" required>
  </div>

  <div class="mb-3">
    <label class="form-label">Contenido</label>
    <textarea
      name="content"
      id="editor"
      class="form-control"
      rows="10"
      
    >{{ post.content | safe if post }}</textarea>
  </div>

 <div class="form-check mb-3">
      <input
        class="form-check-input"
        type="checkbox"
        name="published"
        {% if post and post.published %}checked{% endif %}
      >
      <label class="form-check-label">Publicar</label>
    </div>

  <button type="submit" class="btn btn-success">Guardar</button>
</form>
</div>

<!-- TinyMCE -->
<script src="https://cdn.jsdelivr.net/npm/tinymce@6/tinymce.min.js"></script>

<script>
tinymce.init({
  selector: '#editor',
  height: 450,
  menubar: false,
  plugins: 'lists link image table code',
  toolbar: 'undo redo | styles | bold italic underline | alignleft aligncenter alignright | bullist numlist | link image | code',
  images_upload_url: "{{ url_for('admin.upload_image') }}",
  automatic_uploads: true,
  images_upload_credentials: true,

  /* 🔥 ESTO ES CLAVE */
  relative_urls: false,
  remove_script_host: false,
  convert_urls: false
});
</script>


<!-- 🔥 CLAVE: sincronizar antes del submit -->
<script>
document.getElementById('postForm').addEventListener('submit', function () {
    tinymce.triggerSave();
});
</script>

{% endblock %}

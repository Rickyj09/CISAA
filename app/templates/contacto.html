{% extends "base.html" %}
{% block content %}

<section class="section-light">
    <div class="container">

        <div class="text-center mb-5">
            <h1 class="fw-bold">Contacto</h1>
            <p class="lead">
                Comunícate con nosotros para mayor información
                sobre nuestros servicios.
            </p>
        </div>

        <!-- MENSAJES 
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}-->

        <div class="row justify-content-center">
            <div class="col-md-8">

                <form method="POST" action="/contacto" class="card shadow-sm p-4">

                    <div class="mb-3">
                        <label class="form-label">Nombre completo</label>
                        <input type="text" name="nombre" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Correo electrónico</label>
                        <input type="email" name="email" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Asunto</label>
                        <input type="text" name="asunto" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Mensaje</label>
                        <textarea name="mensaje" rows="5" class="form-control" required></textarea>
                    </div>

                    <div class="text-center">
                        <button type="submit" class="btn btn-success px-4">
                            Enviar mensaje
                        </button>
                    </div>

                </form>

            </div>
        </div>

    </div>

    <div class="container my-5">
  <div class="row g-4 justify-content-center">

    <div class="col-lg-6">
      <div class="card shadow-sm">
        <div class="card-body">
          <h5 class="mb-3">Ubicación de nuestra oficina</h5>

          <div class="ratio ratio-16x9">
            <iframe
              src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d63714.63540005728!2d-78.534!3d-0.22985!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x91d59a3f4c0f8e9b%3A0x123456789abcdef!2sQuito%2C%20Ecuador!5e0!3m2!1ses!2sec!4v0000000000"
              style="border:0;"
              allowfullscreen
              loading="lazy"
              referrerpolicy="no-referrer-when-downgrade">
            </iframe>
          </div>

          <p class="text-muted mt-3 mb-0">
            <strong>Horario de atención:</strong><br>
            Lunes a Viernes, 08:00 – 17:00
          </p>
        </div>
      </div>
    </div>

  </div>
</div>

   

  </div>
</div>

</section>

{% endblock %}
